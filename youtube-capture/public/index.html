<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Capture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0f0f;
  color: #e8e8e8;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem 1rem;
}
.card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 680px;
}
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
.logo-icon {
  background: #ff0000; border-radius: 8px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.logo h1 { font-size: 20px; font-weight: 700; }
.logo span { font-size: 12px; color: #888; display: block; margin-top: 1px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; background: rgba(255,0,0,.1); color: #ff6b6b;
  padding: 3px 9px; border-radius: 20px; margin-bottom: 1.25rem;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4444; }

/* URL list */
.url-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.url-row { display: flex; align-items: center; gap: 8px; }
.url-num {
  min-width: 24px; height: 24px; border-radius: 50%;
  background: #2a2a2a; color: #888; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.url-row.has-value .url-num { background: #ff0000; color: #fff; }
input[type="text"] {
  flex: 1; background: #111; border: 1px solid #2a2a2a;
  border-radius: 8px; padding: 10px 12px;
  color: #e8e8e8; font-size: 13px; outline: none;
  transition: border-color .15s;
}
input[type="text"]:focus { border-color: #ff4444; }
input[type="text"]::placeholder { color: #3a3a3a; }
.remove-btn {
  background: none; border: none; color: #444; cursor: pointer;
  font-size: 18px; padding: 4px; line-height: 1; border-radius: 4px;
  transition: color .15s;
}
.remove-btn:hover { color: #ff6b6b; }

.add-btn {
  background: none; border: 1px dashed #333; border-radius: 8px;
  color: #555; font-size: 13px; padding: 9px;
  width: 100%; cursor: pointer; transition: all .15s; margin-bottom: 1rem;
}
.add-btn:hover { border-color: #ff4444; color: #ff6b6b; }
.add-btn:disabled { opacity: .4; cursor: not-allowed; }

label { display: block; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }

.capture-btn {
  width: 100%; background: #ff0000; color: #fff; border: none;
  border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.capture-btn:hover { opacity: .88; }
.capture-btn:disabled { opacity: .45; cursor: not-allowed; }

.progress-area { margin-top: 1.25rem; display: none; }
.progress-header { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 8px; }
.progress-bar-bg { background: #222; border-radius: 99px; height: 6px; overflow: hidden; margin-bottom: 12px; }
.progress-bar { background: #ff0000; height: 100%; border-radius: 99px; transition: width .4s; width: 0%; }
.progress-list { display: flex; flex-direction: column; gap: 6px; }
.progress-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: #888;
  background: #111; border-radius: 6px; padding: 8px 10px;
}
.progress-item .pi-status { font-size: 14px; flex-shrink: 0; }
.progress-item .pi-url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress-item.done { color: #e8e8e8; }
.progress-item.error .pi-url { color: #f87171; }

.spinner {
  width: 14px; height: 14px; border: 2px solid #333;
  border-top-color: #ff0000; border-radius: 50%;
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-box {
  margin-top: 1rem; background: rgba(255,60,60,.08);
  border: 1px solid rgba(255,60,60,.3); border-radius: 8px;
  padding: 12px 14px; font-size: 13px; color: #f87171; display: none;
}
.download-area {
  margin-top: 1.25rem; display: none;
  background: #111; border: 1px solid #2a2a2a; border-radius: 10px;
  padding: 1rem; text-align: center;
}
.download-area p { font-size: 13px; color: #888; margin-bottom: 10px; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #1a1a2e; border: 1px solid #ff4444;
  color: #ff6b6b; border-radius: 8px; padding: 10px 20px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: background .15s;
}
.dl-btn:hover { background: rgba(255,0,0,.12); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div>
      <h1>YouTube Capture</h1>
      <span>Screenshot at second 5 → PowerPoint</span>
    </div>
  </div>

  <div class="badge"><div class="dot"></div> 1280×720 · วินาทีที่ 5 · ส่งออก .pptx</div>

  <label>YouTube URLs (สูงสุด 10 รายการ)</label>
  <div class="url-list" id="url-list"></div>

  <button class="add-btn" id="add-btn" onclick="addRow()">+ เพิ่ม URL</button>

  <button class="capture-btn" id="capture-btn" onclick="startCapture()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    แคปเจอร์ทั้งหมด → PowerPoint
  </button>

  <div class="error-box" id="error-box"></div>

  <div class="progress-area" id="progress-area">
    <div class="progress-header">
      <span id="progress-label">กำลังประมวลผล...</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-list" id="progress-list"></div>
  </div>

  <div class="download-area" id="download-area">
    <p>✅ แคปเจอร์เสร็จแล้ว พร้อม download</p>
    <a class="dl-btn" id="dl-link" href="#" download="youtube-captures.pptx">
      ⬇ ดาวน์โหลด PowerPoint (.pptx)
    </a>
  </div>
</div>

<script>
const MAX = 10;
let rows = [];

function addRow(value = '') {
  if (rows.length >= MAX) return;
  const id = Date.now();
  rows.push(id);
  renderRows();
  // Focus new input
  setTimeout(() => {
    const inputs = document.querySelectorAll('.url-input');
    inputs[inputs.length - 1]?.focus();
  }, 50);
}

function removeRow(id) {
  if (rows.length <= 1) return;
  rows = rows.filter(r => r !== id);
  renderRows();
}

function renderRows() {
  const list = document.getElementById('url-list');
  // Preserve existing values
  const existing = {};
  list.querySelectorAll('input').forEach(inp => { existing[inp.dataset.id] = inp.value; });

  list.innerHTML = rows.map((id, i) => {
    const val = existing[id] || '';
    return `
    <div class="url-row${val ? ' has-value' : ''}" id="row-${id}">
      <div class="url-num">${i + 1}</div>
      <input type="text" class="url-input" data-id="${id}"
        placeholder="https://www.youtube.com/watch?v=..."
        value="${escHtml(val)}"
        oninput="onInput(this)"
        onkeydown="onKeyDown(event, ${i})">
      ${rows.length > 1 ? `<button class="remove-btn" onclick="removeRow(${id})" title="ลบ">×</button>` : ''}
    </div>`;
  }).join('');

  document.getElementById('add-btn').disabled = rows.length >= MAX;
  document.getElementById('add-btn').textContent = `+ เพิ่ม URL (${rows.length}/${MAX})`;
}

function onInput(inp) {
  const row = inp.closest('.url-row');
  row.classList.toggle('has-value', !!inp.value.trim());
}

function onKeyDown(e, idx) {
  if (e.key === 'Enter') {
    const inputs = document.querySelectorAll('.url-input');
    if (idx < inputs.length - 1) inputs[idx + 1].focus();
    else if (rows.length < MAX) addRow();
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function getUrls() {
  return [...document.querySelectorAll('.url-input')]
    .map(i => i.value.trim()).filter(Boolean);
}

async function startCapture() {
  const urls = getUrls();
  if (urls.length === 0) { showError('กรุณาใส่ URL อย่างน้อย 1 รายการ'); return; }

  document.getElementById('error-box').style.display = 'none';
  document.getElementById('download-area').style.display = 'none';
  document.getElementById('capture-btn').disabled = true;

  // Show progress
  const pa = document.getElementById('progress-area');
  pa.style.display = 'block';
  document.getElementById('progress-count').textContent = `0 / ${urls.length}`;
  document.getElementById('progress-label').textContent = 'กำลังส่งคำขอ...';

  const pl = document.getElementById('progress-list');
  pl.innerHTML = urls.map((u, i) => `
    <div class="progress-item" id="pi-${i}">
      <span class="pi-status">⏳</span>
      <span class="pi-url">${i+1}. ${u}</span>
    </div>`).join('');

  // Mark all as pending
  urls.forEach((_, i) => updateItem(i, 'pending', ''));

  try {
    document.getElementById('progress-label').textContent = 'กำลัง capture และสร้าง PowerPoint...';

    const res = await fetch('/capture-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls }),
    });

    if (!res.ok) {
      const json = await res.json().catch(() => ({}));
      throw new Error(json.error || 'เกิดข้อผิดพลาด');
    }

    // Mark all done (server processes sequentially, no per-item SSE for simplicity)
    urls.forEach((_, i) => updateItem(i, 'done', ''));
    setProgress(urls.length, urls.length);
    document.getElementById('progress-label').textContent = 'เสร็จแล้ว!';

    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const dl = document.getElementById('dl-link');
    dl.href = objUrl;
    dl.download = 'youtube-captures.pptx';
    document.getElementById('download-area').style.display = 'block';
  } catch (err) {
    showError(err.message);
    urls.forEach((_, i) => updateItem(i, 'error', err.message));
  } finally {
    document.getElementById('capture-btn').disabled = false;
  }
}

function updateItem(i, state, msg) {
  const el = document.getElementById(`pi-${i}`);
  if (!el) return;
  const icon = state === 'done' ? '✅' : state === 'error' ? '❌' : state === 'processing' ? '<span class="spinner"></span>' : '⏳';
  el.querySelector('.pi-status').innerHTML = icon;
  el.classList.toggle('done', state === 'done');
  el.classList.toggle('error', state === 'error');
}

function setProgress(done, total) {
  document.getElementById('progress-bar').style.width = (done / total * 100) + '%';
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}

// Init with 3 rows
addRow(); addRow(); addRow();
</script>
</body>
</html>
