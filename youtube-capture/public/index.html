<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Capture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0f0f; color: #e8e8e8;
  min-height: 100vh; padding: 2rem 1rem;
  display: flex; flex-direction: column; align-items: center;
}
.card {
  background: #1a1a1a; border: 1px solid #2a2a2a;
  border-radius: 16px; padding: 2rem;
  width: 100%; max-width: 700px;
}
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
.logo-icon {
  background: #ff0000; border-radius: 8px;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.logo h1 { font-size: 20px; font-weight: 700; }
.logo span { font-size: 12px; color: #888; display: block; margin-top: 1px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; background: rgba(255,0,0,.1); color: #ff6b6b;
  padding: 3px 9px; border-radius: 20px; margin-bottom: 1.25rem;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4444; }

label { display: block; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.url-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
.url-row { display: flex; align-items: center; gap: 8px; }
.url-num {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: #2a2a2a; color: #666; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .2s;
}
.url-row.has-value .url-num { background: #ff0000; color: #fff; }
input[type="text"] {
  flex: 1; background: #111; border: 1px solid #2a2a2a;
  border-radius: 8px; padding: 9px 12px; color: #e8e8e8; font-size: 13px;
  outline: none; transition: border-color .15s;
}
input[type="text"]:focus { border-color: #ff4444; }
input[type="text"]::placeholder { color: #333; }
.remove-btn {
  background: none; border: none; color: #333; cursor: pointer;
  font-size: 18px; padding: 4px; line-height: 1; transition: color .15s;
}
.remove-btn:hover { color: #ff6b6b; }
.add-btn {
  background: none; border: 1px dashed #2a2a2a; border-radius: 8px;
  color: #444; font-size: 13px; padding: 8px; width: 100%;
  cursor: pointer; transition: all .15s; margin-bottom: 1rem;
}
.add-btn:hover { border-color: #ff4444; color: #ff6b6b; }
.add-btn:disabled { opacity: .35; cursor: not-allowed; }

.btn-row { display: flex; gap: 10px; margin-bottom: 1rem; }
.btn {
  flex: 1; border: none; border-radius: 8px; padding: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: opacity .15s;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-preview { background: #222; color: #e8e8e8; border: 1px solid #333; }
.btn-preview:hover:not(:disabled) { background: #2a2a2a; }
.btn-export { background: #ff0000; color: #fff; }
.btn-export:hover:not(:disabled) { opacity: .88; }

/* Excel import */
.excel-bar {
  display: flex; align-items: center; gap: 8px;
  background: #111; border: 1px dashed #2a2a2a; border-radius: 10px;
  padding: 10px 14px; margin-bottom: 12px;
}
.excel-bar-label { font-size: 12px; color: #666; flex: 1; }
.excel-btn {
  background: none; border: 1px solid #2a2a2a; border-radius: 7px;
  color: #aaa; font-size: 12px; padding: 6px 12px; cursor: pointer;
  white-space: nowrap; transition: all .15s; text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
}
.excel-btn:hover { border-color: #4ade80; color: #4ade80; }
.excel-btn.upload:hover { border-color: #60a5fa; color: #60a5fa; }
.excel-limit { font-size: 11px; color: #444; margin-top: 2px; }

.error-box {
  background: rgba(255,60,60,.08); border: 1px solid rgba(255,60,60,.3);
  border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #f87171;
  margin-bottom: 1rem; display: none;
}

/* Preview grid */
.preview-section { margin-top: 1.5rem; display: none; }
.preview-section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.preview-section-header h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
.preview-count { font-size: 12px; color: #555; }
.preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.preview-item {
  background: #111; border: 1px solid #2a2a2a; border-radius: 10px;
  overflow: hidden; position: relative;
}
.preview-item-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #161616; border-bottom: 1px solid #2a2a2a;
}
.pi-num {
  width: 20px; height: 20px; border-radius: 50%; background: #ff0000;
  color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pi-url { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pi-status-icon { font-size: 14px; flex-shrink: 0; }
.preview-img-wrap {
  position: relative; background: #000;
  aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
}
.preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
.preview-img-wrap img.loaded { display: block; }
.preview-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: #444; font-size: 12px;
}
.spinner {
  width: 24px; height: 24px; border: 2px solid #2a2a2a;
  border-top-color: #ff0000; border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pi-error-msg { color: #f87171; font-size: 11px; text-align: center; padding: 0 10px; }
.pi-retry {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,.7); border: 1px solid #333; border-radius: 6px;
  color: #aaa; font-size: 11px; padding: 3px 8px; cursor: pointer;
  display: none;
}
.preview-item.error .pi-retry { display: block; }

.export-area {
  margin-top: 1.5rem; background: #111; border: 1px solid #2a2a2a;
  border-radius: 10px; padding: 1.25rem; text-align: center; display: none;
}
.export-area p { font-size: 13px; color: #888; margin-bottom: 10px; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,0,0,.12); border: 1px solid #ff4444;
  color: #ff6b6b; border-radius: 8px; padding: 10px 22px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: background .15s;
}
.dl-btn:hover { background: rgba(255,0,0,.2); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div>
      <h1>YouTube Capture</h1>
      <span>Screenshot at second 5 → PowerPoint</span>
    </div>
  </div>
  <div class="badge"><div class="dot"></div> 640×480 · วินาทีที่ 5 · ส่งออก .pptx</div>

  <!-- Excel import bar -->
  <div class="excel-bar">
    <div>
      <div class="excel-bar-label">📋 กรอก URL ผ่านไฟล์ Excel</div>
      <div class="excel-limit">ลิมิต 10 ภาพ / ไฟล์</div>
    </div>
    <a class="excel-btn" href="/template" download="youtube-capture-template.xlsx">
      ⬇ ดาวน์โหลด Template
    </a>
    <button class="excel-btn upload" onclick="document.getElementById('excel-input').click()">
      📂 อัปโหลด Excel
    </button>
    <input type="file" id="excel-input" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
  </div>

  <label>หรือพิมพ์ URL ด้านล่าง (สูงสุด 10 รายการ)</label>
  <div class="url-list" id="url-list"></div>
  <button class="add-btn" id="add-btn" onclick="addRow()">+ เพิ่ม URL</button>

  <div class="error-box" id="error-box"></div>

  <div class="btn-row">
    <button class="btn btn-preview" id="preview-btn" onclick="startPreview()">
      🔍 Preview ทั้งหมด
    </button>
    <button class="btn btn-export" id="export-btn" onclick="exportPptx()" disabled>
      ⬇ ส่งออก PowerPoint
    </button>
  </div>

  <!-- Preview Section -->
  <div class="preview-section" id="preview-section">
    <div class="preview-section-header">
      <h2>Preview Screenshot</h2>
      <span class="preview-count" id="preview-count"></span>
    </div>
    <div class="preview-grid" id="preview-grid"></div>
  </div>

  <!-- Download -->
  <div class="export-area" id="export-area">
    <p>✅ สร้าง PowerPoint เสร็จแล้ว</p>
    <a class="dl-btn" id="dl-link" href="#" download="youtube-captures.pptx">
      ⬇ ดาวน์โหลด .pptx
    </a>
  </div>
</div>

<script>
const MAX = 10;
let rows = [];
// Store captured images: { url, image: base64|null, error: str|null }
let captured = [];

// ── URL Rows ──────────────────────────────────────────────────
function addRow(value = '') {
  if (rows.length >= MAX) return;
  const id = Date.now() + Math.random();
  rows.push({ id, value });
  renderRows();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.url-input');
    inputs[inputs.length - 1]?.focus();
  }, 40);
}

function removeRow(id) {
  if (rows.length <= 1) return;
  rows = rows.filter(r => r.id !== id);
  renderRows();
}

function renderRows() {
  const list = document.getElementById('url-list');
  const existing = {};
  list.querySelectorAll('input').forEach(inp => { existing[inp.dataset.id] = inp.value; });

  list.innerHTML = rows.map((r, i) => {
    const val = existing[r.id] !== undefined ? existing[r.id] : r.value;
    return `
    <div class="url-row${val ? ' has-value' : ''}" id="row-${r.id}">
      <div class="url-num">${i + 1}</div>
      <input type="text" class="url-input" data-id="${r.id}"
        placeholder="https://www.youtube.com/watch?v=..."
        value="${esc(val)}"
        oninput="onInput(this)"
        onkeydown="onKey(event,${i})">
      ${rows.length > 1 ? `<button class="remove-btn" onclick="removeRow(${r.id})" title="ลบ">×</button>` : ''}
    </div>`;
  }).join('');

  const addBtn = document.getElementById('add-btn');
  addBtn.disabled = rows.length >= MAX;
  addBtn.textContent = `+ เพิ่ม URL (${rows.length}/${MAX})`;
}

function onInput(inp) {
  inp.closest('.url-row').classList.toggle('has-value', !!inp.value.trim());
  // Reset export if URLs change
  captured = [];
  document.getElementById('export-btn').disabled = true;
  document.getElementById('export-area').style.display = 'none';
}

function onKey(e, idx) {
  if (e.key !== 'Enter') return;
  const inputs = document.querySelectorAll('.url-input');
  if (idx < inputs.length - 1) inputs[idx + 1].focus();
  else if (rows.length < MAX) addRow();
}

function getUrls() {
  return [...document.querySelectorAll('.url-input')].map(i => i.value.trim()).filter(Boolean);
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Preview ───────────────────────────────────────────────────
async function startPreview() {
  const urls = getUrls();
  if (!urls.length) { showError('กรุณาใส่ URL อย่างน้อย 1 รายการ'); return; }

  hideError();
  captured = urls.map(url => ({ url, image: null, error: null }));

  document.getElementById('export-btn').disabled = true;
  document.getElementById('export-area').style.display = 'none';
  document.getElementById('preview-btn').disabled = true;
  document.getElementById('preview-btn').textContent = '⏳ กำลัง Preview...';

  // Build grid with loading placeholders
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = urls.map((url, i) => `
    <div class="preview-item" id="pi-${i}">
      <div class="preview-item-header">
        <div class="pi-num">${i+1}</div>
        <div class="pi-url" title="${esc(url)}">${url}</div>
        <span class="pi-status-icon" id="pi-icon-${i}">⏳</span>
      </div>
      <div class="preview-img-wrap" id="pi-wrap-${i}">
        <div class="preview-placeholder">
          <div class="spinner"></div>
          <span>กำลัง capture...</span>
        </div>
        <button class="pi-retry" onclick="retryOne(${i})">↺ ลองใหม่</button>
      </div>
    </div>`).join('');

  document.getElementById('preview-section').style.display = 'block';
  document.getElementById('preview-count').textContent = `0 / ${urls.length} เสร็จแล้ว`;

  let done = 0;
  // Capture sequentially (free tier: 1 at a time)
  for (let i = 0; i < urls.length; i++) {
    await captureOne(i, urls[i]);
    done++;
    document.getElementById('preview-count').textContent = `${done} / ${urls.length} เสร็จแล้ว`;
  }

  document.getElementById('preview-btn').disabled = false;
  document.getElementById('preview-btn').textContent = '🔍 Preview ทั้งหมด';

  const hasAny = captured.some(c => c.image);
  document.getElementById('export-btn').disabled = !hasAny;
}

async function captureOne(i, url) {
  setItemState(i, 'loading');
  try {
    const res = await fetch('/capture-single', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || 'เกิดข้อผิดพลาด');

    captured[i].image = json.image;
    captured[i].error = null;
    setItemState(i, 'done', json.image);
  } catch (err) {
    captured[i].error = err.message;
    captured[i].image = null;
    setItemState(i, 'error', null, err.message);
  }
}

async function retryOne(i) {
  const url = captured[i]?.url;
  if (!url) return;
  await captureOne(i, url);
  const hasAny = captured.some(c => c.image);
  document.getElementById('export-btn').disabled = !hasAny;
}

function setItemState(i, state, b64, errMsg) {
  const wrap = document.getElementById(`pi-wrap-${i}`);
  const icon = document.getElementById(`pi-icon-${i}`);
  const item = document.getElementById(`pi-${i}`);

  item.classList.remove('error');

  if (state === 'loading') {
    icon.textContent = '⏳';
    wrap.innerHTML = `<div class="preview-placeholder"><div class="spinner"></div><span>กำลัง capture...</span></div>
      <button class="pi-retry" onclick="retryOne(${i})">↺ ลองใหม่</button>`;
  } else if (state === 'done') {
    icon.textContent = '✅';
    wrap.innerHTML = `<img src="data:image/png;base64,${b64}" onload="this.classList.add('loaded')" alt="screenshot ${i+1}">
      <button class="pi-retry" onclick="retryOne(${i})" style="display:block">↺ capture ใหม่</button>`;
  } else if (state === 'error') {
    icon.textContent = '❌';
    item.classList.add('error');
    wrap.innerHTML = `<div class="preview-placeholder"><span style="font-size:24px">⚠️</span>
      <span class="pi-error-msg">${errMsg}</span></div>
      <button class="pi-retry" onclick="retryOne(${i})">↺ ลองใหม่</button>`;
  }
}

// ── Export PPTX ───────────────────────────────────────────────
async function exportPptx() {
  if (!captured.length) return;
  const exportBtn = document.getElementById('export-btn');
  exportBtn.disabled = true;
  exportBtn.textContent = '⏳ กำลังสร้าง...';
  hideError();

  try {
    const res = await fetch('/build-pptx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: captured }),
    });

    if (!res.ok) {
      const json = await res.json().catch(() => ({}));
      throw new Error(json.error || 'เกิดข้อผิดพลาด');
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const dl = document.getElementById('dl-link');
    dl.href = url;
    dl.download = 'youtube-captures.pptx';
    document.getElementById('export-area').style.display = 'block';
    dl.click(); // auto download
  } catch (err) {
    showError(err.message);
  } finally {
    exportBtn.disabled = false;
    exportBtn.textContent = '⬇ ส่งออก PowerPoint';
  }
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

// ── Import Excel ──────────────────────────────────────────────
async function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const fd = new FormData();
  fd.append('file', file);

  try {
    const res = await fetch('/parse-excel', { method: 'POST', body: fd });
    const json = await res.json();
    if (!res.ok || json.error) { showError(json.error || 'อ่านไฟล์ไม่ได้'); return; }

    const { urls } = json;
    if (urls.length > 10) { showError('ไฟล์มี URL เกิน 10 รายการ'); return; }

    // Replace rows with imported URLs
    rows = urls.map((url, i) => ({ id: Date.now() + i, value: url }));
    // Pad to at least 3 rows
    while (rows.length < 3) rows.push({ id: Date.now() + rows.length + 100, value: '' });
    renderRows();
    // Populate inputs
    setTimeout(() => {
      document.querySelectorAll('.url-input').forEach((inp, i) => {
        if (urls[i]) { inp.value = urls[i]; inp.closest('.url-row').classList.add('has-value'); }
      });
    }, 50);

    hideError();
    captured = [];
    document.getElementById('export-btn').disabled = true;
    document.getElementById('export-area').style.display = 'none';
    document.getElementById('preview-section').style.display = 'none';
  } catch (err) {
    showError('อ่านไฟล์ไม่ได้: ' + err.message);
  }
}

// Init
addRow(); addRow(); addRow();
</script>
</body>
</html>
