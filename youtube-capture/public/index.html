<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Capture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0f0f;
  color: #e8e8e8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 2.5rem;
  width: 100%;
  max-width: 640px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 2rem;
}
.logo-icon {
  background: #ff0000;
  border-radius: 8px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.logo h1 {
  font-size: 20px;
  font-weight: 700;
}
.logo span {
  font-size: 13px;
  color: #888;
  margin-top: 2px;
  display: block;
}
.desc {
  font-size: 13px;
  color: #888;
  margin-bottom: 1.5rem;
  line-height: 1.7;
  background: #111;
  padding: 12px 14px;
  border-radius: 8px;
  border-left: 3px solid #ff0000;
}
label {
  display: block;
  font-size: 12px;
  color: #888;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
input[type="text"] {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 12px 14px;
  color: #e8e8e8;
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}
input[type="text"]:focus { border-color: #ff0000; }
input[type="text"]::placeholder { color: #444; }
button {
  margin-top: 1rem;
  width: 100%;
  background: #ff0000;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button:hover { opacity: .88; }
button:disabled { opacity: .5; cursor: not-allowed; }

.status {
  margin-top: 1.25rem;
  font-size: 13px;
  color: #888;
  display: none;
  align-items: center;
  gap: 8px;
}
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid #333;
  border-top-color: #ff0000;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  margin-top: 1rem;
  background: rgba(255,60,60,.08);
  border: 1px solid rgba(255,60,60,.3);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  color: #f87171;
  display: none;
}

.result {
  margin-top: 1.5rem;
  display: none;
}
.result-header {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.result img {
  width: 100%;
  border-radius: 10px;
  border: 1px solid #2a2a2a;
}
.download-btn {
  font-size: 12px;
  padding: 6px 12px;
  margin-top: 0;
  width: auto;
  border-radius: 6px;
  background: #222;
  border: 1px solid #333;
  font-weight: 500;
}
.download-btn:hover { background: #2a2a2a; opacity: 1; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  background: rgba(255,0,0,.1);
  color: #ff6b6b;
  padding: 3px 8px;
  border-radius: 20px;
  margin-bottom: 1.25rem;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4444; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div>
      <h1>YouTube Capture</h1>
      <span>Screenshot at second 5</span>
    </div>
  </div>

  <div class="badge"><div class="dot"></div> Screenshot 1280×720 · วินาทีที่ 5</div>

  <div class="desc">
    วางลิงก์ YouTube แล้วระบบจะเปิดวิดีโอและแคปเจอร์ screenshot ขนาด 1280×720 ที่วินาทีที่ 5 โดยอัตโนมัติ
  </div>

  <div>
    <label>YouTube URL</label>
    <input type="text" id="url-input"
      placeholder="https://www.youtube.com/watch?v=..."
      onkeydown="if(event.key==='Enter') capture()">
  </div>

  <button id="capture-btn" onclick="capture()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    แคปเจอร์ Screenshot
  </button>

  <div class="status" id="status">
    <div class="spinner"></div>
    <span id="status-text">กำลังเปิดวิดีโอและรอวินาทีที่ 5...</span>
  </div>

  <div class="error" id="error"></div>

  <div class="result" id="result">
    <div class="result-header">
      <span>ผลลัพธ์ Screenshot</span>
      <button class="download-btn" id="download-btn">⬇ ดาวน์โหลด</button>
    </div>
    <img id="result-img" src="" alt="YouTube Screenshot">
  </div>
</div>

<script>
let lastBlob = null;

async function capture() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) { showError('กรุณาใส่ YouTube URL'); return; }

  const btn = document.getElementById('capture-btn');
  btn.disabled = true;

  document.getElementById('error').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('status').style.display = 'flex';

  const steps = [
    'กำลังเปิดวิดีโอใน browser...',
    'รอวิดีโอโหลด...',
    'แคปเจอร์ที่วินาทีที่ 5...',
    'ประมวลผล screenshot...',
  ];
  let stepIdx = 0;
  const statusText = document.getElementById('status-text');
  statusText.textContent = steps[0];
  const stepTimer = setInterval(() => {
    stepIdx = Math.min(stepIdx + 1, steps.length - 1);
    statusText.textContent = steps[stepIdx];
  }, 2000);

  try {
    const res = await fetch('/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });

    clearInterval(stepTimer);

    if (!res.ok) {
      const json = await res.json().catch(() => ({ error: 'เกิดข้อผิดพลาด' }));
      throw new Error(json.error || 'เกิดข้อผิดพลาด');
    }

    const blob = await res.blob();
    lastBlob = blob;
    const objUrl = URL.createObjectURL(blob);

    document.getElementById('result-img').src = objUrl;
    document.getElementById('result').style.display = 'block';
    document.getElementById('download-btn').onclick = () => {
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = 'youtube-capture.png';
      a.click();
    };
  } catch (err) {
    clearInterval(stepTimer);
    showError(err.message);
  } finally {
    document.getElementById('status').style.display = 'none';
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
