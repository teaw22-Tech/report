<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Capture DV360 → PowerPoint</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:rgba(255,255,255,.1);--text:#e6edf3;--muted:#7d8590;--accent:#1D9E75;--red:#f85149}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;max-width:520px;width:100%}
  h1{font-size:18px;margin-bottom:6px}
  p.desc{color:var(--muted);font-size:13px;margin-bottom:1.5rem;line-height:1.6}
  .field{margin-bottom:1rem}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input[type=file]{width:100%;font-size:13px;color:var(--text)}
  input[type=number]{width:100px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:13px}
  button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:.5rem}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-cancel{background:transparent;border:1px solid var(--red);color:var(--red);display:none}
  .log{margin-top:1.25rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:12px;max-height:240px;overflow-y:auto;display:none;white-space:pre-wrap;line-height:1.6}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}
  .download{display:none;margin-top:1rem;text-align:center;padding:10px;background:rgba(29,158,117,.12);border:1px solid var(--accent);border-radius:8px;color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
  .err{color:var(--red)}
</style>
</head>
<body>
<div class="card">
  <h1>📸 Ads Capture DV360 → PowerPoint</h1>
  <p class="desc">อัปโหลดไฟล์ Excel ที่มีรายชื่อ Ads และลิงก์ (คอลัมน์ NAME, TYPE, URL) ระบบจะวิ่งเข้าไปแคปภาพแต่ละลิงก์ แล้วรวมเป็นไฟล์ PowerPoint ให้อัตโนมัติ</p>

  <form id="form">
    <div class="field">
      <label>ไฟล์ Excel (.xlsx)</label>
      <input type="file" name="excel" id="excel" accept=".xlsx,.xls" required>
    </div>
    <button type="submit" id="submitBtn">เริ่มแคปภาพและสร้าง PowerPoint</button>
  </form>
  <button type="button" id="cancelBtn" class="btn-cancel">⏹ ยกเลิกการทำงาน</button>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="log" id="log"></div>
  <a class="download" id="download" href="#">⬇️ ดาวน์โหลดไฟล์ PowerPoint</a>
</div>

<script>
const form = document.getElementById('form');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const logEl = document.getElementById('log');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const downloadEl = document.getElementById('download');
let currentJobId = null;

function appendLog(text, isErr){
  logEl.style.display = 'block';
  const line = document.createElement('div');
  if(isErr) line.className = 'err';
  line.textContent = text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function stopUI(){
  submitBtn.disabled = false;
  cancelBtn.style.display = 'none';
  cancelBtn.disabled = false;
  cancelBtn.textContent = '⏹ ยกเลิกการทำงาน';
  currentJobId = null;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  cancelBtn.style.display = 'block';
  logEl.innerHTML = '';
  downloadEl.style.display = 'none';
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';

  const formData = new FormData();
  formData.append('excel', document.getElementById('excel').files[0]);

  try {
    const res = await fetch('/api/generate', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) { appendLog('ผิดพลาด: ' + data.error, true); stopUI(); return; }

    currentJobId = data.jobId;
    const evtSource = new EventSource('/api/progress/' + data.jobId);
    evtSource.onmessage = (msg) => {
      const ev = JSON.parse(msg.data);
      if (ev.type === 'start') {
        appendLog(`พบทั้งหมด ${ev.total} รายการ กำลังเริ่มแคปภาพ...`);
      } else if (ev.type === 'progress') {
        if (ev.status === 'running') {
          appendLog(`(${ev.index+1}/${ev.total}) กำลังแคป: ${ev.name}`);
        } else {
          appendLog(`  -> ${ev.status === 'ok' ? 'สำเร็จ' : 'ผิดพลาด: ' + ev.error}`, ev.status !== 'ok');
          progressFill.style.width = Math.round(((ev.index+1)/ev.total)*100) + '%';
        }
      } else if (ev.type === 'done') {
        appendLog('เสร็จสิ้น! กดปุ่มด้านล่างเพื่อดาวน์โหลด');
        downloadEl.href = ev.downloadUrl;
        downloadEl.style.display = 'block';
        stopUI();
        evtSource.close();
      } else if (ev.type === 'cancelled') {
        appendLog('ยกเลิกแล้ว — ดาวน์โหลดผลลัพธ์ที่ทำไปแล้วได้');
        downloadEl.href = ev.downloadUrl;
        downloadEl.style.display = 'block';
        stopUI();
        evtSource.close();
      } else if (ev.type === 'error') {
        appendLog('เกิดข้อผิดพลาด: ' + ev.error, true);
        stopUI();
        evtSource.close();
      }
    };
    evtSource.onerror = () => { evtSource.close(); };
  } catch (err) {
    appendLog('ผิดพลาด: ' + err.message, true);
    stopUI();
  }
});

cancelBtn.addEventListener('click', async () => {
  if (!currentJobId) return;
  cancelBtn.disabled = true;
  cancelBtn.textContent = 'กำลังยกเลิก...';
  appendLog('กำลังขอยกเลิก...');
  try {
    await fetch('/api/cancel/' + currentJobId, { method: 'POST' });
  } catch (err) {
    appendLog('ยกเลิกไม่สำเร็จ: ' + err.message, true);
    cancelBtn.disabled = false;
    cancelBtn.textContent = '⏹ ยกเลิกการทำงาน';
  }
});
</script>
</body>
</html>
